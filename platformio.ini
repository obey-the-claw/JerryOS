; JerryOS - PlatformIO project
;
; Board: AIPI Lite (ESP32-S3, 16 MB quad flash, 8 MB octal PSRAM - verified
; on Steve's unit at Checkpoint 1, see docs/HARDWARE.md).
;
; The platform version is pinned on purpose: espressif32 6.x ships the
; Arduino-ESP32 2.0.x core, which LovyanGFX and NimBLE-Arduino both support
; well. Pinning means a build that works today still works next month.

[env:aipi-lite]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; --- Memory layout (matches the verified chip) ---
board_build.arduino.memory_type = qio_opi   ; quad flash + octal PSRAM
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600     ; size of one app slot in default_16MB.csv
board_build.partitions = default_16MB.csv

; --- USB: the AIPI Lite has no USB chip; the ESP32-S3 talks USB itself ---
; USB_MODE=1 uses the built-in USB-Serial/JTAG; CDC_ON_BOOT=1 sends
; Serial.print() out over the USB-C cable.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    lovyan03/LovyanGFX@1.2.7

monitor_speed = 115200
monitor_filters = time
